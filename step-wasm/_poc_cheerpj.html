<!doctype html>
<html>
  <head>
    <title>POC - Cheerpj</title>
    <script>
      (async () => {
        const worker = new SharedWorker("./wasm-worker.js", {
          name: "STEP WASM Worker",
        });
        globalThis.worker = worker;
        worker.port.start();
        let end = null;
        const workerMessageRouter = {
          ready: (e) => {
            worker.port.postMessage({
              action: "getTextWithOptions",
              args: ["ESV", "Jhn 1", "HVUG", ""],
            });
          },
          "return:getTextWithOptions": (e) => {
            const app = document.getElementById("app");
            app.innerHTML = e.data.value;
          },
          default: (e) => {
            console.warn("unhandled action", e.data);
          },
        };
        worker.port.onmessage = (e) => {
          console.debug("wasm-worker message", e);
          (workerMessageRouter[e.data?.action] || workerMessageRouter.default)(
            e,
          );
        };
        worker.port.onerror = (e) => {
          console.error("wasm-worker error", e);
        };
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
